<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="flex_printing">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>flex_printing</title>
  <link rel="manifest" href="manifest.json">

  <style>
    html, body {
      height: 100%;
      margin: 0;
      background: #0f172a;
    }

    #web-splash {
      position: fixed;
      inset: 0;
      z-index: 9999;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #111111 0%, #ED2024 100%);
      color: #e5e7eb;
      font-family: Arial, sans-serif;
      transition: opacity 220ms ease;
    }

    #web-splash.fade-out {
      opacity: 0;
      pointer-events: none;
    }

    .splash-content {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0;
    }

    .logo-wrap {
      padding: 28px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 0 22px 4px rgba(0, 229, 255, 0.2);
      animation: pulse 1200ms ease-in-out infinite alternate;
    }

    .logo-wrap img {
      width: 80px;
      height: 80px;
      object-fit: contain;
      display: block;
    }

    .title {
      margin-top: 20px;
      color: #ffffff;
      font-size: 26px;
      font-weight: 700;
      letter-spacing: 1.1px;
    }

    .progress {
      margin-top: 10px;
      width: 160px;
      height: 6px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.08);
      overflow: hidden;
      position: relative;
    }

    .progress::before {
      content: "";
      position: absolute;
      inset: 0;
      width: 45%;
      border-radius: 999px;
      background: #ED2024;
      animation: indeterminate 1.1s ease-in-out infinite;
    }

    .subtitle {
      margin-top: 14px;
      color: rgba(255, 255, 255, 0.6);
      font-size: 13px;
      letter-spacing: 0.3px;
    }

    @keyframes pulse {
      from { transform: scale(0.85); }
      to { transform: scale(1); }
    }

    @keyframes indeterminate {
      0% { transform: translateX(-120%); }
      100% { transform: translateX(260%); }
    }
  </style>
</head>
<body>
  <div id="web-splash" aria-label="Loading">
    <div class="splash-content">
      <div class="logo-wrap">
        <img src="icons/Icon-192.png" alt="App logo">
      </div>
      <div class="title">TEX Print</div>
      <div class="progress"></div>
      <div class="subtitle">Getting your content ready</div>
    </div>
  </div>

  <script>
    window.addEventListener('flutter-first-frame', function () {
      var splash = document.getElementById('web-splash');
      if (!splash) return;
      splash.classList.add('fade-out');
      setTimeout(function () { splash.remove(); }, 250);
    });
  </script>

  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
