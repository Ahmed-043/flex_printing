    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; }

        #flutter_splash {
          position: fixed; inset: 0;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          background: #ffffff;
          z-index: 9999; overflow: hidden;
        }

        #thread-canvas {
          position: absolute; inset: 0;
          width: 100%; height: 100%; opacity: 0.06;
        }

        /* .scan-beam (vertical animated bar) removed */

        .splash-center {
          position: relative; z-index: 1;
          display: flex; flex-direction: column;
          align-items: center; gap: 24px;
        }

        .logo-area {
          position: relative; width: 260px; height: 260px;
          display: flex; align-items: center; justify-content: center;
        }

        /* Translucent radial glow — uses rgba so threads/bg show through */
        .logo-glow {
          position: absolute;
          width: 260px; height: 260px;
          border-radius: 50%;
          background: radial-gradient(circle,
            rgba(210,150,150,0.55) 0%,
            rgba(225,180,180,0.35) 28%,
            rgba(255,200,200,0.15) 58%,
            rgba(255,225,225,0.0)  100%
          );
          animation: glowPulse 2.6s ease-in-out infinite;
          pointer-events: none;
        }
        @keyframes glowPulse {
          0%, 100% { transform: scale(0.6); opacity: 0.6; }
          50%       { transform: scale(1.085); opacity: 1;   }
        }

        .logo-img-wrap {
          position: relative; z-index: 1;
          width: 140px; height: 140px;
          display: flex; align-items: center; justify-content: center;
          animation: logoPulse 2.6s ease-in-out infinite;
        }
        .logo-img-wrap img {
          width: 140px; height: 140px;
          object-fit: contain; display: block;
        }
        @keyframes logoPulse {
          0%, 100% { transform: scale(1);    }
          50%       { transform: scale(1.05); }
        }

        .brand-text {
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: clamp(20px, 4.5vw, 28px);
          font-weight: 800; letter-spacing: 0.22em;
          color: #1a1a1a; text-transform: uppercase; text-align: center;
          animation: fadeUp 0.8s ease both;
        }
        .brand-text span { color: #E8121A; }
        .brand-sub {
          margin-top: 5px;
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: clamp(10px, 2vw, 12px);
          font-weight: 400; letter-spacing: 0.32em; color: #aaa;
          text-transform: uppercase; text-align: center;
          animation: fadeUp 0.8s 0.18s ease both;
        }
        @keyframes fadeUp {
          from { opacity: 0; transform: translateY(14px); }
          to   { opacity: 1; transform: translateY(0);    }
        }

        .progress-wrap {
          width: clamp(200px, 50vw, 280px); height: 3px;
          background: rgba(0,0,0,0.07); border-radius: 99px; overflow: hidden;
          animation: fadeUp 0.8s 0.35s ease both;
        }
        .progress-fill {
          height: 100%; width: 0; border-radius: 99px;
          background: linear-gradient(90deg, #c0000a 0%, #E8121A 55%, #ff6060 100%);
          animation: pf 2.8s cubic-bezier(.4,0,.2,1) forwards;
        }
        @keyframes pf {
          0%{width:0} 40%{width:52%} 70%{width:74%} 90%{width:90%} 100%{width:100%}
        }

        .status-text {
          font-family: 'Segoe UI', Arial, sans-serif;
          font-size: 11px; letter-spacing: 0.16em;
          color: #E8121A; text-transform: uppercase;
          transition: opacity 0.35s;
        }

        #flutter_splash.fade-out { animation: out 0.5s ease forwards; }
        @keyframes out { to { opacity: 0; pointer-events: none; } }
    </style>

<body>
<noscript>
    <div style="padding:16px;font-family:Arial,Helvetica,sans-serif;">
        TEX PRINT requires JavaScript to run. Please enable JavaScript in your browser.
    </div>
</noscript>

<div id="flutter_splash" aria-label="Loading TEX PRINT">

    <canvas id="thread-canvas"></canvas>

    <div class="splash-center">

        <div class="logo-area">
            <div class="logo-glow"></div>
            <div class="logo-img-wrap">
                <img src="logo.png" alt="TEX PRINT logo" />
            </div>
        </div>

        <div>
            <div class="brand-text"><span>TEX</span> PRINT</div>
            <div class="brand-sub">Textile Printing Machinery</div>
        </div>

        <div class="progress-wrap">
            <div class="progress-fill"></div>
        </div>

        <div class="status-text" id="status-label">Initializing...</div>

    </div>
</div>

<script>
    (function () {
      var canvas = document.getElementById('thread-canvas');
      var ctx = canvas.getContext('2d');
      var W, H, threads = [];
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      function makeThread() {
        var isH = Math.random() > 0.5;
        return { isH: isH,
          pos:   isH ? Math.random() * (H || 600) : Math.random() * (W || 400),
          off:   Math.random() * 600,
          spd:   0.18 + Math.random() * 0.22,
          hue:   Math.random() > 0.5 ? 0 : 355,
          alpha: 0.4 + Math.random() * 0.45,
          w:     0.4 + Math.random() * 0.7
        };
      }
      resize();
      window.addEventListener('resize', resize);
      for (var i = 0; i < 30; i++) threads.push(makeThread());
      var t = 0;
      function draw() {
        ctx.clearRect(0, 0, W, H); t += 0.5;
        threads.forEach(function (h) {
          var wave = Math.sin((t + h.off) * 0.018) * 5;
          ctx.beginPath();
          ctx.strokeStyle = 'hsla(' + h.hue + ',80%,45%,' + h.alpha + ')';
          ctx.lineWidth = h.w;
          if (h.isH) { ctx.moveTo(0, h.pos + wave); ctx.lineTo(W, h.pos - wave); }
          else        { ctx.moveTo(h.pos + wave, 0); ctx.lineTo(h.pos - wave, H); }
          ctx.stroke();
          if (!h.isH) { h.pos += h.spd; if (h.pos > W + 10) { h.pos = -10; h.off = Math.random() * 600; } }
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    var msgs = ['Initializing...', 'Loading modules...', 'Preparing workspace...', 'Almost ready...'];
    var mi = 0, el = document.getElementById('status-label');
    var iv = setInterval(function () {
      mi = (mi + 1) % msgs.length; el.style.opacity = '0';
      setTimeout(function () { el.textContent = msgs[mi]; el.style.opacity = '1'; }, 200);
    }, 720);

    window.addEventListener('flutter-first-frame', function () {
      clearInterval(iv);
      var s = document.getElementById('flutter_splash');
      if (s) { s.classList.add('fade-out'); setTimeout(function () { s.remove(); }, 540); }
    });
</script>
