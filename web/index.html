    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { width: 100%; height: 100%; background: #fff; overflow: hidden; }

        #flutter_splash {
          position: fixed; inset: 0;
          display: flex; flex-direction: column;
          align-items: center; justify-content: center;
          background: #ffffff;
          z-index: 9999; overflow: hidden;
        }

        #thread-canvas {
          position: absolute; inset: 0;
          width: 100%; height: 100%; opacity: 0.06;
        }

        /* .scan-beam (vertical animated bar) removed */

        .splash-center {
          position: relative; z-index: 1;
          display: flex; flex-direction: column;
          align-items: center; gap: 24px;
        }

        .logo-area {
          position: relative; width: 260px; height: 260px;
          display: flex; align-items: center; justify-content: center;
        }

        /* Translucent radial glow — uses rgba so threads/bg show through */
        .logo-glow {
          position: absolute;
          width: 260px; height: 260px;
          border-radius: 50%;
          background: radial-gradient(circle,
            rgba(210,150,150,0.55) 0%,
            rgba(225,180,180,0.35) 28%,
            rgba(255,200,200,0.15) 58%,
            rgba(255,225,225,0.0)  100%
          );
          animation: glowPulse 2.6s ease-in-out infinite;
          pointer-events: none;
        }
        @keyframes glowPulse {
          0%, 100% { transform: scale(0.6); opacity: 0.6; }
          50%       { transform: scale(1.085); opacity: 1;   }
        }

        .logo-img-wrap {
          position: relative; z-index: 1;
          width: 140px; height: 140px;
          display: flex; align-items: center; justify-content: center;
          animation: logoPulse 2.6s ease-in-out infinite;
        }
        .logo-img-wrap img {
          width: 140px; height: 140px;
          object-fit: contain; display: block;
        }
        @keyframes logoPulse {
          0%, 100% { transform: scale(1);    }
          50%       { transform: scale(1.05); }
        }

        /* Brand text, subtitle and loading bar removed from splash */

        /* Zoom overlay used to animate logo expanding to cover viewport
           after Flutter has rendered the first frame. We clone the logo
           into a fixed overlay and apply a GPU-friendly transform. */
        .splash-zoom-overlay {
          position: fixed;
          z-index: 100000;
          left: 0; top: 0;
          display: flex;
          align-items: center;
          justify-content: center;
          overflow: hidden;
          border-radius: 50%;
          will-change: transform, border-radius, opacity;
          /* Controlled zoom: slower, smooth ease-out. Adjust duration here.
             Note: reduce the scale multiplier in the JS (currently 7.50) to avoid
             an abrupt initial jump or very long visual coverage. */
          transition: transform 6400ms cubic-bezier(.22,.8,.2,1), border-radius 9400ms cubic-bezier(.22,.8,.2,1), opacity 800ms ease;
          background: #ffffff;
        }
        .splash-zoom-overlay img { width: 100%; height: 100%; object-fit: contain; display: block; }
        .splash-zoom-overlay.zoomed { border-radius: 0; }

        #flutter_splash.fade-out { animation: out 0.5s ease forwards; }
        @keyframes out { to { opacity: 0; pointer-events: none; } }
    </style>

<body>
<noscript>

<div id="flutter_splash" aria-label="Loading TEX PRINT">

    <canvas id="thread-canvas"></canvas>

    <div class="splash-center">

        <div class="logo-area">
            <div class="logo-glow"></div>
            <div class="logo-img-wrap">
                <img src="logo.png" alt="TEX PRINT logo" />
            </div>
        </div>

        <!-- Brand text, subtitle and loading bar removed -->

    </div>
</div>

<script>
    (function () {
      var canvas = document.getElementById('thread-canvas');
      var ctx = canvas.getContext('2d');
      var W, H, threads = [];
      function resize() { W = canvas.width = window.innerWidth; H = canvas.height = window.innerHeight; }
      function makeThread() {
        var isH = Math.random() > 0.5;
        return { isH: isH,
          pos:   isH ? Math.random() * (H || 600) : Math.random() * (W || 400),
          off:   Math.random() * 600,
          spd:   0.18 + Math.random() * 0.22,
          hue:   Math.random() > 0.5 ? 0 : 355,
          alpha: 0.4 + Math.random() * 0.45,
          w:     0.4 + Math.random() * 0.7
        };
      }
      resize();
      window.addEventListener('resize', resize);
      for (var i = 0; i < 30; i++) threads.push(makeThread());
      var t = 0;
      function draw() {
        ctx.clearRect(0, 0, W, H); t += 0.5;
        threads.forEach(function (h) {
          var wave = Math.sin((t + h.off) * 0.018) * 5;
          ctx.beginPath();
          ctx.strokeStyle = 'hsla(' + h.hue + ',80%,45%,' + h.alpha + ')';
          ctx.lineWidth = h.w;
          if (h.isH) { ctx.moveTo(0, h.pos + wave); ctx.lineTo(W, h.pos - wave); }
          else        { ctx.moveTo(h.pos + wave, 0); ctx.lineTo(h.pos - wave, H); }
          ctx.stroke();
          if (!h.isH) { h.pos += h.spd; if (h.pos > W + 10) { h.pos = -10; h.off = Math.random() * 600; } }
        });
        requestAnimationFrame(draw);
      }
      draw();
    })();

    window.addEventListener('flutter-first-frame', function () {
      // Perform a zoom animation: clone the logo, expand it to cover the
      // viewport, then remove the splash so the Flutter app becomes visible.
      var splash = document.getElementById('flutter_splash');
      var logoWrap = document.querySelector('.logo-img-wrap');
      var logoImg = logoWrap && logoWrap.querySelector('img');

      if (!splash || !logoImg) {
        if (splash) { splash.remove(); }
        return;
      }

      var rect = logoImg.getBoundingClientRect();

      var overlay = document.createElement('div');
      overlay.className = 'splash-zoom-overlay';
      overlay.style.left = rect.left + 'px';
      overlay.style.top = rect.top + 'px';
      overlay.style.width = rect.width + 'px';
      overlay.style.height = rect.height + 'px';
      overlay.style.transform = 'translate(0px, 0px) scale(1)';
      overlay.style.opacity = '1';

      var clone = logoImg.cloneNode(true);
      overlay.appendChild(clone);
      document.body.appendChild(overlay);

      // Force layout to ensure the transition runs
      // eslint-disable-next-line no-unused-expressions
      overlay.getBoundingClientRect();

      var vw = Math.max(window.innerWidth, document.documentElement.clientWidth);
      var vh = Math.max(window.innerHeight, document.documentElement.clientHeight);
      var centerX = vw / 2;
      var centerY = vh / 2;
      var currentCenterX = rect.left + rect.width / 2;
      var currentCenterY = rect.top + rect.height / 2;
      var tx = centerX - currentCenterX;
      var ty = centerY - currentCenterY;

      var scaleX = vw / rect.width;
      var scaleY = vh / rect.height;
      // Reduce the overshoot multiplier to avoid an excessively large final size
      // which makes the movement feel fast at start and then linger. 2.8 is a
      // moderate overshoot that covers the viewport without extreme scaling.
      var scale = Math.max(scaleX, scaleY) * 2.8;

      requestAnimationFrame(function () {
        overlay.style.transform = 'translate(' + tx + 'px, ' + ty + 'px) scale(' + scale + ')';
        overlay.classList.add('zoomed');
      });

      var cleanup = function () {
        overlay.style.opacity = '0';
        // wait for opacity fade to finish before removing
        setTimeout(function () {
          try { overlay.remove(); } catch (e) {}
        }, 320);
        try { splash.remove(); } catch (e) {}
        overlay.removeEventListener('transitionend', cleanup);
      };

      overlay.addEventListener('transitionend', function (ev) {
        if (ev.propertyName === 'transform') cleanup();
      });

      // Safety fallback (should be longer than the transform + fade)
      setTimeout(cleanup, 1500);
    });
</script>
