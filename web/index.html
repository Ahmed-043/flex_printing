<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Base href replaced by Flutter build --base-href -->
  <base href="$FLUTTER_BASE_HREF" />

  <meta charset="UTF-8" />
  <meta http-equiv="X-UA-Compatible" content="IE=Edge" />

  <!-- Mobile / Theme -->
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0B57D0" />
  <meta name="color-scheme" content="light dark" />

  <!-- Primary SEO -->
  <title>TEX PRINT | Textile Printing Machinery</title>
  <meta
          name="description"
          content="TEX PRINT — Textile printing machinery and solutions: DTF, sublimation, UV, roll-to-roll transfer, and more."
  />
  <meta name="robots" content="index,follow,max-image-preview:large,max-snippet:-1,max-video-preview:-1" />
  <link rel="canonical" href="https://texprinttp.com/" />

  <!-- App manifest -->
  <link rel="manifest" href="manifest.json" />

  <!-- Favicons / icons (recommended set) -->
  <link rel="icon" type="image/png" href="logo.png"/>

  <!-- iOS / PWA -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="TEX PRINT" />

  <!-- Open Graph -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="TEX PRINT" />
  <meta property="og:title" content="TEX PRINT | Textile Printing Machinery" />
  <meta
          property="og:description"
          content="Textile printing machinery and solutions: DTF, sublimation, UV, roll-to-roll transfer, and more."
  />
  <meta property="og:url" content="https://texprinttp.com/" />

  <!-- IMPORTANT: create this image at 1200x630 and place it under /web/seo/og-image.png -->
  <meta property="og:image" content="https://texprinttp.com/seo/og-image.png" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="TEX PRINT | Textile Printing Machinery" />
  <meta
          name="twitter:description"
          content="Textile printing machinery and solutions: DTF, sublimation, UV, roll-to-roll transfer, and more."
  />
  <meta name="twitter:image" content="https://texprinttp.com/seo/og-image.png" />
  <meta name="google-site-verification" content="v-ak-JMSf1rcFA-7pbRu6KMeDL294VHPB8FgXFlH9rg" />
  <!-- Structured data -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "TEX PRINT",
      "url": "https://texprinttp.com/",
      "logo": "https://texprinttp.com/logo.png",
      "description": "Textile printing machinery and solutions: DTF, sublimation, UV, roll-to-roll transfer, and more.",
      "sameAs": []
    }
  </script>

  <style>
    /* Simple splash screen until Flutter renders the first frame. */
    HTML, body { width: 100%; height: 100%; margin: 0; padding: 0; }
    #flutter_splash {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: white;
      z-index: 9999;
    }
    #flutter_splash img {
      display: block;
      width: min(160px, 60vw);
      height: auto;
      max-height: 60vh;
    }
  </style>
</head>

<body>
<noscript>
  <div style="padding:16px;font-family:Arial,Helvetica,sans-serif;">
    TEX PRINT requires JavaScript to run. Please enable JavaScript in your browser.
  </div>
</noscript>

<div id="flutter_splash" aria-label="Loading">
  <img src="logo.svg" alt="TEX PRINT logo" />
</div>

<script>
  window.addEventListener('flutter-first-frame', function () {
    var splash = document.getElementById('flutter_splash');
    if (splash) splash.remove();
  });
</script>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
